[package]
name = "java"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "iguana-java"
path = "src/main.rs"
test = false

[dependencies]
iguana-runtime = { version = "=0.1.0-alpha.2", features = ["cli"] }
rustc-hash = "2.1.1"
serde_json = "1.0"

[features]
debug-trace = ["iguana-runtime/debug-trace"]
instrument = ["iguana-runtime/instrument"]
dhat-heap = ["iguana-runtime/dhat-heap"]
profile = ["iguana-runtime/profile"]

[profile.release]
debug = true
