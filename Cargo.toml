[package]
name = "java"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "iguana-java"
path = "src/main.rs"
test = false

[dependencies]
iguana-runtime = { path = "/Users/afroozeh/Workspace/iguana-rs/iguana-runtime" }
clap = { version = "4.5.51", features = ["derive"] }
log = "0.4"
rustc-hash = "2.1.1"
serde_json = "1.0"
dhat = "0.3"
pprof = { version = "0.14", features = ["flamegraph"], optional = true }

[features]
dhat-heap = []
debug-trace = ["iguana-runtime/debug-trace"]
profile = ["pprof"]
instrument = ["iguana-runtime/instrument"]

[profile.release]
debug = true
