name: Compare modes

# Checks that the default parser and the same grammar in first-parse mode
# build the same tree for every corpus file. The corpus test only compares
# the outcome of each parse, so a change that reshapes a tree still passes
# it. This workflow is what catches such a change, and it is what lets a
# release say that the two modes differ in speed alone.
#
# The comparison parses the whole corpus twice, so it runs on request and
# from the release workflow instead of on every push.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      # The generator version comes from the manifest, as in the test
      # workflow, because the first-parse parser has to be generated by the
      # same release that generated the committed sources.
      - name: Resolve the generator version
        id: generator
        run: |
          VERSION=$(cargo metadata --format-version 1 --locked | jq -r '
            .packages[]
            | select(.name == "iguana-runtime" and (.source // "" | startswith("registry+")))
            | .version')
          test -n "$VERSION" || {
            echo '::error::iguana-runtime must be a published version, not a path dependency.'
            exit 1
          }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache the iguana binary
        id: iguana-bin
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/iguana
          key: iguana-${{ runner.os }}-${{ steps.generator.outputs.version }}

      - name: Install iguana
        if: steps.iguana-bin.outputs.cache-hit != 'true'
        run: cargo install iguana --version ${{ steps.generator.outputs.version }} --locked

      - name: Build the default parser
        run: cargo build --release --locked

      - name: Cache corpus checkouts
        id: corpus
        uses: actions/cache@v4
        with:
          path: corpus/.cache
          key: corpus-${{ hashFiles('corpus/repos.txt') }}

      # The corpus has to be on disk before the comparison can walk it, and
      # --corpus-test is what fetches it. It also parses every file and fails
      # on a regression, which is the test workflow's job rather than this
      # one's, so the result is ignored here. The step is skipped when the
      # checkouts are already in the cache.
      - name: Fetch the corpus
        if: steps.corpus.outputs.cache-hit != 'true'
        continue-on-error: true
        run: ./target/release/iguana-java --corpus-test

      # The result of the fetch is ignored above, so a failed clone would
      # leave both parsers comparing the same missing files and agreeing. A
      # cache saved from such a run would repeat that, so the check looks at
      # the checkouts themselves rather than at the step. It compares against
      # the file count that each baseline records, because a half-finished
      # checkout has files in it too.
      - name: Require every corpus to be complete
        run: |
          while read -r NAME EXT _; do
            case "$NAME" in ''|\#*) continue ;; esac
            BASELINE="corpus/$NAME.txt"
            test -f "$BASELINE" || {
              echo "::error::corpus $NAME has no baseline at $BASELINE."
              exit 1
            }
            EXPECTED=$(sed -n 's/^# files=\([0-9]*\).*/\1/p' "$BASELINE")
            # -L because the parser's own walk follows directory symlinks,
            # and a checkout that has one reaches files through it.
            FOUND=$(find -L "corpus/.cache/$NAME" -name "*.$EXT" 2>/dev/null | wc -l | tr -d ' ')
            test "$FOUND" = "$EXPECTED" || {
              echo "::error::corpus $NAME has $FOUND .$EXT files, and its baseline records $EXPECTED."
              exit 1
            }
          done < corpus/repos.txt

      - name: Compare the two modes
        run: ./scripts/compare-modes.sh

      # The script keeps the digest output files and the trees of the files
      # that differ. They are the reason to look at a failed run, so they are
      # uploaded.
      - name: Upload the digest output files and trees
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compare-modes
          path: target/compare-modes
          if-no-files-found: ignore
