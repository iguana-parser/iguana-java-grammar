name: Test

# Reusable test workflow: regenerate the parser with the released iguana the
# manifest pins, verify the committed sources match, then run the golden and
# corpus suites. The iguana-version input overrides that pin, which an
# iguana-rs caller can use to test a different source of the generator.
on:
  workflow_call:
    inputs:
      iguana-version:
        description: Overrides the released iguana version to generate with, which otherwise comes from the manifest pin
        type: string
        default: ''
      commit:
        description: Exact commit to test, for a release candidate that is not yet on main
        type: string
        default: ''

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # A same-repository caller checks out its own ref unless it passes a
      # commit, which the release workflow does to test a candidate that is
      # not on main yet. A cross-repository caller gets its own repository
      # from a bare checkout, not this one. The iguana-rs caller, when it
      # exists, must pass this repository and a ref explicitly and check out
      # both sides.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      # The generator must match the runtime the manifest pins, or the
      # regeneration check below compares the output of one release against
      # sources written by another.
      - name: Resolve the generator version
        id: generator
        env:
          OVERRIDE: ${{ inputs.iguana-version }}
        run: |
          VERSION="$OVERRIDE"
          if [ -z "$VERSION" ]; then
            VERSION=$(cargo metadata --format-version 1 --locked | jq -r '
              .packages[]
              | select(.name == "iguana-runtime" and (.source // "" | startswith("registry+")))
              | .version')
          fi
          test -n "$VERSION" || {
            echo '::error::iguana-runtime must be a published version, not a path dependency.'
            exit 1
          }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Generating with iguana $VERSION." >> "$GITHUB_STEP_SUMMARY"

      - name: Cache the iguana binary
        id: iguana-bin
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/iguana
          key: iguana-${{ runner.os }}-${{ steps.generator.outputs.version }}

      - name: Install iguana
        if: steps.iguana-bin.outputs.cache-hit != 'true'
        run: cargo install iguana --version ${{ steps.generator.outputs.version }} --locked

      - name: Regenerate the parser
        run: iguana generate

      # Non-blocking: generated terminal-set order is build-dependent
      # (release-alpha-findings.md item 25), so regeneration on the runner
      # produces reorder-only diffs against the macOS-generated sources.
      # Make this step required again once the generator emits sets in
      # canonical order.
      - name: Committed sources match the generator output
        continue-on-error: true
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            git diff
            exit 1
          fi

      - name: Restore committed sources
        run: git checkout -- .

      - name: Build
        run: cargo build --release --locked

      - name: Golden tests
        run: ./target/release/iguana-java --dir tests --ext java --start CompilationUnit --check-sexpr

      - name: Cache corpus checkouts
        uses: actions/cache@v4
        with:
          path: corpus/.cache
          key: corpus-${{ hashFiles('corpus/repos.txt') }}

      - name: Corpus test
        run: ./target/release/iguana-java --corpus-test
